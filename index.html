<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tulips & Camera Surprise 🌷📸</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: linear-gradient(180deg, #ffe6f0 0%, #ffccd5 50%, #ffb3c6 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Top Navigation Dashboard */
    .top-dashboard {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 20;
    }

    .character-badge {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #ff9ebb;
      font-size: 0.85rem;
      font-weight: bold;
      color: #d63384;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    /* Camera Button */
    .camera-btn {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
      color: white;
      border: 2px solid #ffffff;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s;
    }

    .camera-btn:active {
      transform: scale(0.92);
    }

    /* Main Center Action Area */
    .center-action {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    /* Giant Main Tulip Button */
    .tulip-spawn-btn {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 4px solid #ff758c;
      border-radius: 50%;
      width: 130px;
      height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tulip-spawn-btn:hover {
      transform: scale(1.08);
    }

    .tulip-spawn-btn:active {
      transform: scale(0.9);
    }

    .tulip-spawn-btn span {
      font-size: 50px;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .btn-label {
      color: #d63384;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid #ffb3c6;
    }

    /* Falling Tulip Element */
    .falling-tulip {
      position: absolute;
      z-index: 15;
      cursor: pointer;
      transition: transform 0.1s;
      animation: floatRotate 3s ease-in-out infinite alternate;
    }

    .falling-tulip:active {
      transform: scale(1.3) !important;
    }

    @keyframes floatRotate {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    /* Message Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: white;
      border-radius: 25px;
      border: 4px solid #ffb3c6;
      padding: 25px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-card h3 {
      color: #d63384;
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    .modal-card p {
      color: #555;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .close-modal-btn {
      background: #ff758c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Camera View Modal */
    .camera-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
    }

    .camera-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: white;
      padding: 0 10px;
      font-weight: bold;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 60vh;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #ffb3c6;
      background: #222;
    }

    video, canvas#photoCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Filter Classes */
    .filter-pink { filter: sepia(0.3) hue-rotate(300deg) saturate(1.4) brightness(1.05); }
    .filter-vintage { filter: sepia(0.6) contrast(1.1) brightness(0.9); }
    .filter-romantic { filter: saturate(1.6) contrast(1.05) brightness(1.1); }

    .filter-options {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid white;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #ff758c;
      border-color: #ff758c;
    }

    .camera-controls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 10px;
    }

    .snap-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: white;
      border: 5px solid #ff758c;
      cursor: pointer;
    }

    .save-btn {
      background: #2ec4b6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
      cursor: pointer;
    }

    .close-cam-btn {
      background: rgba(255,255,255,0.3);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Dashboard -->
  <div class="top-dashboard">
    <div class="character-badge">🐱 Kitty</div>
    <button class="camera-btn" onclick="openCamera()">📸 Take Photo</button>
    <div class="character-badge">🐰 Bunny</div>
  </div>

  <!-- Center Action (Tulip Button) -->
  <div class="center-action">
    <div class="tulip-spawn-btn" onclick="spawnTulip()">
      <span>🌷</span>
    </div>
    <div class="btn-label">Pindutin para maglaglag ng Tulip! ✨</div>
  </div>

  <!-- Message Modal -->
  <div class="modal-overlay" id="messageModal">
    <div class="modal-card">
      <h3 id="modalTitle">Special Message 🌸</h3>
      <p id="modalText">Message content here...</p>
      <button class="close-modal-btn" onclick="closeModal()">Salamat! 💕</button>
    </div>
  </div>

  <!-- Camera Modal -->
  <div class="camera-modal" id="cameraModal">
    <div class="camera-header">
      <span>Cute Filter Camera 📸</span>
      <button class="close-cam-btn" onclick="closeCamera()">Close X</button>
    </div>

    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="photoCanvas" style="display: none;"></canvas>
    </div>

    <!-- Filters -->
    <div class="filter-options">
      <button class="filter-btn active" onclick="applyFilter('none', this)">Normal</button>
      <button class="filter-btn" onclick="applyFilter('filter-pink', this)">Pink Glow</button>
      <button class="filter-btn" onclick="applyFilter('filter-romantic', this)">Romantic</button>
      <button class="filter-btn" onclick="applyFilter('filter-vintage', this)">Vintage</button>
    </div>

    <!-- Controls -->
    <div class="camera-controls">
      <button class="snap-btn" id="snapBtn" onclick="takeSnapshot()"></button>
      <button class="save-btn" id="saveBtn" onclick="savePhoto()">Save Photo 💾</button>
      <button class="close-cam-btn" id="retakeBtn" style="display:none;" onclick="retakePhoto()">Retake 🔄</button>
    </div>
  </div>

  <script>
    // Motivational Messages Array
    const messages = [
      { title: "Kaya Mo 'Yan! 💖", text: "Naniniwala ako sa kakayahan mo. Napakasipag mo kaya kayang-kaya mo ang exam bukas!" },
      { title: "Stay Calm ✨", text: "Huminga nang malalim. Ginawa mo ang best mo sa pag-aaral kaya magtiwala ka lang sa sarili mo." },
      { title: "Reminder 🍚", text: "'Wag kakalimutang kumain nang maayos para may lakas ang katawan at isip mo!" },
      { title: "Good Night 😴", text: "Matulog nang maaga ngayong gabi para fresh at alerto ang mind mo bukas!" },
      { title: "You Are Amazing 🌷", text: "Proud na proud ako sa lahat ng effort mo. Good luck sa exam, cutie!" },
      { title: "Focus & Trust 🍀", text: "Isang step na lang! Tatapusin mo 'yang exam nang may ngiti sa mukha." },
      { title: "Cheering for You! 🐰", text: "Sina Kitty at Bunny ay nakasuporta sa'yo! You can do it!" }
    ];

    // Spawn Falling Tulips
    function spawnTulip() {
      const tulip = document.createElement('div');
      tulip.className = 'falling-tulip';
      tulip.innerHTML = '🌷';
      tulip.style.fontSize = (Math.random() * 20 + 35) + 'px';
      
      // Random X position
      const startX = Math.random() * (window.innerWidth - 60) + 10;
      tulip.style.left = startX + 'px';
      tulip.style.top = '-50px';

      // Pick a random message for this tulip
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      tulip.onclick = () => showMessage(randomMsg.title, randomMsg.text, tulip);

      document.body.appendChild(tulip);

      // Animate Falling Physics
      let currentY = -50;
      const speed = Math.random() * 2 + 2;
      const targetY = window.innerHeight - 60;

      function fall() {
        if (currentY < targetY) {
          currentY += speed;
          tulip.style.top = currentY + 'px';
          requestAnimationFrame(fall);
        }
      }
      requestAnimationFrame(fall);
    }

    // Modal Display
    function showMessage(title, text, element) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalText').innerText = text;
      document.getElementById('messageModal').style.display = 'flex';

      // Remove tulip after click
      if (element) {
        element.style.transform = 'scale(0)';
        setTimeout(() => element.remove(), 200);
      }
    }

    function closeModal() {
      document.getElementById('messageModal').style.display = 'none';
    }

    // --- CAMERA SYSTEM ---
    let stream = null;
    let currentFilter = 'none';

    async function openCamera() {
      const modal = document.getElementById('cameraModal');
      const video = document.getElementById('webcam');
      modal.style.display = 'flex';

      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user' }, 
          audio: false 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Hindi ma-access ang camera. Siguraduhing pinayagan mo ang camera permission!");
        closeCamera();
      }
    }

    function closeCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('cameraModal').style.display = 'none';
      retakePhoto();
    }

    function applyFilter(filterClass, btn) {
      currentFilter = filterClass;
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('photoCanvas');

      video.className = filterClass;
      canvas.className = filterClass;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function takeSnapshot() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('photoCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      video.style.display = 'none';
      canvas.style.display = 'block';

      document.getElementById('snapBtn').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'inline-block';
      document.getElementById('retakeBtn').style.display = 'inline-block';
    }

    function retakePhoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('photoCanvas');

      video.style.display = 'block';
      canvas.style.display = 'none';

      document.getElementById('snapBtn').style.display = 'block';
      document.getElementById('saveBtn').style.display = 'none';
      document.getElementById('retakeBtn').style.display = 'none';
    }

    function savePhoto() {
      const canvas = document.getElementById('photoCanvas');
      const link = document.createElement('a');
      link.download = 'cute-surprise-photo.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
